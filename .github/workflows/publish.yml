name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v${tag} does not match package.json version ${version}"
            exit 1
          fi

      - name: Format, lint, and type check
        run: vp check

      - name: Run tests (unit + browser)
        run: vp test run

      - name: Build library
        run: vp build

      - name: Publish to npm
        run: npm publish --provenance --access public
